# Render blueprint for the API. Create a free MongoDB Atlas cluster first,
# then add its connection string as MONGODB_URI when Render asks.
services:
  - type: web
    name: tradelog-api
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund --workspace server --include-workspace-root
    startCommand: npm start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://usman1905.github.io
