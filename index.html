<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeLog · Trading journal</title>
<meta name="description" content="TradeLog is a trading journal that tracks every trade, risk per position and which setups make money.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><span class="logo__mark"></span>TradeLog</div>
    <nav>
      <button class="nav-btn on" data-view="dashboard">Dashboard</button>
      <button class="nav-btn" data-view="trades">Trades</button>
    </nav>
    <div class="side__foot">
      <button class="link" id="resetBtn">Reset sample data</button>
      <button class="link" id="exportBtn">Export CSV</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div>
        <h1 id="viewTitle">Dashboard</h1>
        <p class="muted" id="viewSub">Performance across all logged trades</p>
      </div>
      <div class="top__actions">
        <select id="rangeSel" aria-label="Date range">
          <option value="all">All time</option>
          <option value="90">Last 90 days</option>
          <option value="30">Last 30 days</option>
        </select>
        <button class="btn btn--primary" id="newTradeBtn">+ New trade</button>
      </div>
    </header>

    <section id="view-dashboard">
      <div class="kpis" id="kpis"></div>
      <div class="grid2">
        <div class="card card--chart">
          <div class="card__head"><h2>Equity curve</h2><span class="muted" id="equityNote"></span></div>
          <canvas id="equity" height="260"></canvas>
        </div>
        <div class="card">
          <div class="card__head"><h2>R distribution</h2><span class="muted">Result per trade in R</span></div>
          <canvas id="hist" height="260"></canvas>
        </div>
      </div>
      <div class="grid2">
        <div class="card">
          <div class="card__head"><h2>By setup</h2><span class="muted">Which strategies pay</span></div>
          <div class="table-wrap"><table class="table" id="setupTable"></table></div>
        </div>
        <div class="card">
          <div class="card__head"><h2>Recent trades</h2><button class="link" data-view="trades">View all</button></div>
          <div class="table-wrap"><table class="table" id="recentTable"></table></div>
        </div>
      </div>
    </section>

    <section id="view-trades" hidden>
      <div class="filters">
        <input id="search" type="search" placeholder="Search symbol, setup or notes" aria-label="Search trades">
        <select id="sideFilter" aria-label="Side"><option value="">All sides</option><option>Long</option><option>Short</option></select>
        <select id="resultFilter" aria-label="Result"><option value="">All results</option><option value="win">Winners</option><option value="loss">Losers</option></select>
      </div>
      <div class="card card--flush"><div class="table-wrap"><table class="table table--full" id="tradeTable"></table></div></div>
    </section>
  </main>
</div>

<dialog id="tradeDialog">
  <form id="tradeForm" method="dialog">
    <h2>New trade</h2>
    <div class="form-grid">
      <label>Date<input name="date" type="date" required></label>
      <label>Symbol<input name="symbol" placeholder="BTCUSDT" required></label>
      <label>Side<select name="side"><option>Long</option><option>Short</option></select></label>
      <label>Setup<input name="setup" list="setups" placeholder="Breakout" required></label>
      <label>Entry<input name="entry" type="number" step="any" required></label>
      <label>Stop loss<input name="stop" type="number" step="any" required></label>
      <label>Exit<input name="exit" type="number" step="any" required></label>
      <label>Quantity<input name="qty" type="number" step="any" required></label>
      <label class="full">Notes<textarea name="notes" rows="2" placeholder="Why did you take it? What did you learn?"></textarea></label>
    </div>
    <p class="preview" id="preview">Fill in entry, stop, exit and quantity to see the result.</p>
    <p class="error" id="formError" role="alert"></p>
    <div class="form-actions">
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn btn--primary">Save trade</button>
    </div>
  </form>
</dialog>
<datalist id="setups"></datalist>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="app.js"></script>
</body>
</html>
